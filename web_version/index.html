<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guess-O-Mania</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <div class="game-box">

            <!-- Heading -->

            <h1>
                <i class="fa-solid fa-bullseye"></i>
                Guess-O-Mania
            </h1>

            <p class="description">
                Guess the hidden number before the timer beats you.
                Choose a difficulty level and start playing.
            </p>

            <!-- Game Statistics -->

            <div class="game-info">

                <div class="info-box">

                    <h3>Attempts</h3>

                    <p id="attempts">0</p>

                </div>

                <div class="info-box">

                    <h3>Best Score</h3>

                    <p id="best-score">--</p>

                </div>

                <div class="info-box">

                    <h3>Timer</h3>

                    <p id="timer">0 sec</p>

                </div>

            </div>

            <!-- Difficulty -->

            <div class="difficulty">

                <label for="difficulty">
                    Select Difficulty
                </label>

                <select id="difficulty">

                    <option value="50">
                        Easy (1 - 50)
                    </option>

                    <option value="100" selected>
                        Medium (1 - 100)
                    </option>

                    <option value="500">
                        Hard (1 - 500)
                    </option>

                </select>

            </div>

            <!-- Guess Input -->

            <input
                type="number"
                id="guess-input"
                placeholder="Enter your guess">

            <!-- Guess Button -->

            <button id="guess-btn">

                <i class="fa-solid fa-dice"></i>

                Guess Number

            </button>

            <!-- Result Message -->

            <p id="message">

                💡 Enter a number to start playing.

            </p>

            <!-- Restart -->

            <button id="restart-btn">

                <i class="fa-solid fa-rotate-right"></i>

                Play Again

            </button>

            <!-- Footer -->

            <footer>

                Developed by <strong>Akshaykumar Santi</strong>

            </footer>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
